<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow Pro - Enterprise Task Manager</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for professional UI icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <main class="app-container">
        <header class="app-header">
            <div class="header-top">
                <h1><i class="fa-solid fa-list-check"></i> TaskFlow Pro</h1>
                <div id="liveClock" class="live-clock">--:--:-- --</div>
            </div>
            <p class="subtitle">Organize, prioritize, and execute with precision.</p>
        </header>

        <section class="task-input-section">
            <div class="input-group">
                <input type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off">
                <select id="priorityInput" aria-label="Task Priority">
                    <option value="Low">Low Priority</option>
                    <option value="Medium" selected>Medium Priority</option>
                    <option value="High">High Priority</option>
                </select>
                <input type="datetime-local" id="dueDateInput" aria-label="Due Date and Time">
                <button id="addTaskBtn" class="btn-primary"><i class="fa-solid fa-plus"></i> Add Task</button>
            </div>
        </section>

        <section class="task-controls">
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
            </div>
            <div class="task-stats">
                <span id="taskCount">0 tasks remaining</span>
            </div>
        </section>

        <section class="task-list-container">
            <ul id="taskList"></ul>
            <div id="emptyState" class="empty-state hidden">
                <i class="fa-solid fa-clipboard-question"></i>
                <p>No tasks found. You're completely caught up!</p>
            </div>
        </section>
    </main>

    <!-- Toast Notification Popup Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
